services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: fireflies-clone-backend
    env: python
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: DATABASE_URL
        value: sqlite:///./fireflies.db

  # 2. Next.js Static Website Service (Free on Render)
  - type: static
    name: fireflies-clone-frontend
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fireflies-clone-backend
          property: host
